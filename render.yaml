services:
  - type: web
    name: ecomm-store-ibrahim-umar001-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    disk:
      name: product-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOADS_DIRECTORY
        value: /var/data/uploads
      - key: DATABASE_URL
        fromDatabase:
          name: ecomm-store-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: ecomm-store-postgres
    plan: 0.1c-256mb
    databaseName: ecomm_store
    user: ecomm_store
